<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Final local AI stack on a consumer laptop</title>
  <desc id="desc">Top-down architecture: applications, task routing, reasoning policy, three model roles, llama.cpp runtime, GGUF/Q4_K_M memory layer, RTX 5060 laptop hardware.</desc>
  <style>
    .lbl  { fill:#6b7280; font: 500 13px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    .ttl  { fill:#111827; font: 600 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    .sub  { fill:#6b7280; font: 500 12px ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    .box  { fill:#ffffff; stroke:#9ca3af; stroke-width:1.5; }
    .abox { fill:#ffffff; stroke:#2563eb; stroke-width:2; }
    .line { fill:none; stroke:#9ca3af; stroke-width:1.5; }
    .aline{ fill:none; stroke:#2563eb; stroke-width:2; }
    .dot  { fill:#2563eb; }
    @media (prefers-color-scheme: dark) {
      .lbl  { fill:#9ca3af; }
      .ttl  { fill:#f3f4f6; }
      .sub  { fill:#9ca3af; }
      .box  { fill:#0d1117; stroke:#6b7280; }
      .abox { fill:#0d1117; stroke:#60a5fa; }
      .line { stroke:#6b7280; }
      .aline{ stroke:#60a5fa; }
      .dot  { fill:#60a5fa; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="aline"/>
    </marker>
    <marker id="gh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="line"/>
    </marker>
  </defs>

  <!-- 1. Apps -->
  <rect class="box" x="370" y="20" width="220" height="52" rx="8"/>
  <text class="ttl" x="480" y="44" text-anchor="middle">Applications / Agents / CLI</text>
  <text class="sub" x="480" y="62" text-anchor="middle">Hermes · DSH · direct API</text>

  <line class="line" x1="480" y1="72" x2="480" y2="100" marker-end="url(#gh)"/>

  <!-- 2. Task Routing -->
  <rect class="box" x="370" y="104" width="220" height="52" rx="8"/>
  <text class="ttl" x="480" y="128" text-anchor="middle">Task Routing</text>
  <text class="sub" x="480" y="146" text-anchor="middle">route by task role</text>

  <line class="line" x1="480" y1="156" x2="480" y2="184" marker-end="url(#gh)"/>

  <!-- 3. Reasoning Policy -->
  <rect class="box" x="370" y="188" width="220" height="52" rx="8"/>
  <text class="ttl" x="480" y="212" text-anchor="middle">Reasoning Policy</text>
  <text class="sub" x="480" y="230" text-anchor="middle">native · fixed-budget</text>

  <!-- 3 branches to models -->
  <line class="line" x1="480" y1="240" x2="230" y2="296" marker-end="url(#gh)"/>
  <line class="line" x1="480" y1="240" x2="480" y2="296" marker-end="url(#gh)"/>
  <line class="line" x1="480" y1="240" x2="730" y2="296" marker-end="url(#gh)"/>

  <!-- 4. Models (3, accent) -->
  <rect class="abox" x="140" y="300" width="180" height="82" rx="8"/>
  <text class="ttl" x="230" y="324" text-anchor="middle">Ornith</text>
  <text class="sub" x="230" y="344" text-anchor="middle">default / resident</text>
  <text class="lbl" x="230" y="362" text-anchor="middle">35B-A3B · Q4_K_M</text>

  <rect class="abox" x="390" y="300" width="180" height="82" rx="8"/>
  <text class="ttl" x="480" y="324" text-anchor="middle">Nex</text>
  <text class="sub" x="480" y="344" text-anchor="middle">hard tasks</text>
  <text class="lbl" x="480" y="362" text-anchor="middle">Nex-N2-mini · Q4_K_M</text>

  <rect class="abox" x="640" y="300" width="180" height="82" rx="8"/>
  <text class="ttl" x="710" y="324" text-anchor="middle">Gemma</text>
  <text class="sub" x="710" y="344" text-anchor="middle">secondary</text>
  <text class="lbl" x="710" y="362" text-anchor="middle">Gemma4-26B-A4B · Q4_K_M</text>

  <!-- 3 models converge to runtime (accent) -->
  <line class="aline" x1="230" y1="382" x2="430" y2="416" marker-end="url(#ah)"/>
  <line class="aline" x1="480" y1="382" x2="480" y2="416" marker-end="url(#ah)"/>
  <line class="aline" x1="710" y1="382" x2="530" y2="416" marker-end="url(#ah)"/>

  <!-- 5. llama.cpp (accent) -->
  <rect class="abox" x="370" y="420" width="220" height="52" rx="8"/>
  <text class="ttl" x="480" y="444" text-anchor="middle">llama.cpp · llama-server</text>
  <text class="sub" x="480" y="462" text-anchor="middle">b10375 · experts on CPU</text>

  <line class="aline" x1="480" y1="472" x2="480" y2="500" marker-end="url(#ah)"/>

  <!-- 6. Memory / Quant (accent) -->
  <rect class="abox" x="280" y="504" width="400" height="52" rx="8"/>
  <text class="ttl" x="480" y="528" text-anchor="middle">GGUF · Q4_K_M · memory strategy</text>
  <text class="sub" x="480" y="546" text-anchor="middle">KV q8 · MoE expert banks · pageable / pinned</text>

  <line class="aline" x1="480" y1="556" x2="480" y2="590" marker-end="url(#ah)"/>

  <!-- 7. Hardware (accent) -->
  <rect class="abox" x="220" y="594" width="520" height="62" rx="10"/>
  <text class="ttl" x="480" y="618" text-anchor="middle">RTX 5060 Laptop · 8 GB VRAM · 32 GB DDR5</text>
  <text class="sub" x="480" y="638" text-anchor="middle">attention / dense on GPU · MoE experts on CPU</text>

  <!-- accent legend -->
  <text class="lbl" x="480" y="708" text-anchor="middle">accent = active deployment path on this laptop</text>
</svg>